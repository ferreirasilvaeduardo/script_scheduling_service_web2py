<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Sprite proprio do SSS (grade 24x24, traco). Uso: <svg class="sss-icon"><use href=".../icons.svg#id"></use></svg> -->

  <!-- Status do ticket: silhuetas distintas para nao depender so da cor -->
  <symbol id="status-pending" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 3.5h10M7 20.5h10"/>
    <path d="M8 3.5c0 4 4 5.5 4 8.5s-4 4.5-4 8.5M16 3.5c0 4-4 5.5-4 8.5s4 4.5 4 8.5"/>
    <path d="M10 18.5h4"/>
  </symbol>
  <symbol id="status-running" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12a7 7 0 1 1-2.05-4.95"/>
    <path d="M17.4 3.6v3.8h-3.8"/>
    <path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/>
  </symbol>
  <symbol id="status-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="16" height="16" rx="3"/>
    <path d="M8 12.5l2.8 2.8L16 9.5"/>
  </symbol>
  <symbol id="status-failed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 3.5h7l5 5v7l-5 5h-7l-5-5v-7z"/>
    <path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/>
  </symbol>
  <symbol id="status-cancelled" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M6 18L18 6"/>
  </symbol>
  <symbol id="status-unknown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5l8.5 8.5-8.5 8.5-8.5-8.5z" stroke-dasharray="2.5 2"/>
    <path d="M10.2 10a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4"/>
    <path d="M12 15.6v.1"/>
  </symbol>

  <!-- Identidade -->
  <symbol id="icon-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2.5"/>
    <path d="M7 9.5l3 2.5-3 2.5M12.5 15h4.5"/>
  </symbol>

  <!-- Menu -->
  <symbol id="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/>
    <path d="M10 9v6l5-3z" fill="currentColor"/>
  </symbol>
  <symbol id="icon-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 7h10.5M9.5 12h10.5M9.5 17h10.5"/>
    <rect x="4" y="6" width="2" height="2" rx=".4"/>
    <rect x="4" y="11" width="2" height="2" rx=".4"/>
    <rect x="4" y="16" width="2" height="2" rx=".4"/>
  </symbol>
  <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="8.5" r="3"/>
    <path d="M3.5 19c.6-3.2 2.9-5 5.5-5s4.9 1.8 5.5 5"/>
    <path d="M15.5 5.8a3 3 0 0 1 0 5.4M17 14.2c1.9.5 3.1 2.2 3.5 4.8"/>
  </symbol>
  <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l7.5 2.8v5.4c0 4.6-3.1 8-7.5 9.8-4.4-1.8-7.5-5.2-7.5-9.8V5.8z"/>
    <path d="M12 8v8M8.5 12h7"/>
  </symbol>
  <symbol id="icon-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="16" height="6.5" rx="1.5"/>
    <rect x="4" y="13.5" width="16" height="6.5" rx="1.5"/>
    <path d="M7.5 7.25h.01M7.5 16.75h.01M11 7.25h5.5M11 16.75h5.5"/>
  </symbol>
  <symbol id="icon-file-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3.5h8l4.5 4.5v12.5H6z"/>
    <path d="M14 3.5V8h4.5"/>
    <path d="M10.5 12l-2 2 2 2M13.5 12l2 2-2 2"/>
  </symbol>
  <symbol id="icon-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/>
    <circle cx="15" cy="7" r="2"/>
    <circle cx="9" cy="12" r="2"/>
    <circle cx="17" cy="17" r="2"/>
  </symbol>
  <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="15.5" rx="2"/>
    <path d="M3.5 10h17M8 3v4M16 3v4"/>
    <path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/>
  </symbol>
  <symbol id="icon-audit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6"/>
    <path d="M15 15l5.5 5.5"/>
    <path d="M8 9h5M8 12h3.5"/>
  </symbol>

  <!-- Acoes e avisos -->
  <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
  </symbol>
  <symbol id="icon-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.8L21 19.5H3z"/>
    <path d="M12 9.5v4.5M12 16.8v.2"/>
  </symbol>
  <symbol id="icon-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="12" height="12" rx="1.5"/>
  </symbol>
  <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.5 11A7.5 7.5 0 0 0 6 7.2M4.5 13A7.5 7.5 0 0 0 18 16.8"/>
    <path d="M6 3.5v3.7h3.7M18 20.5v-3.7h-3.7"/>
  </symbol>
  <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 12c2.3-4 5.6-6 9.5-6s7.2 2 9.5 6c-2.3 4-5.6 6-9.5 6s-7.2-2-9.5-6z"/>
    <circle cx="12" cy="12" r="2.8"/>
  </symbol>
  <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/>
    <path d="M5 19.5h14"/>
  </symbol>
</svg>
