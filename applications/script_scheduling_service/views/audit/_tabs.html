{{
# Abas da área de auditoria. Variável de entrada: aba_ativa ('index' | 'agents').
_tabs = (('index', u'Trilha de auditoria'), ('agents', u'Agentes'))
}}<nav aria-label="Seções da auditoria">
  <ul class="nav nav-tabs sss-tabs-audit">
    {{for _tab_f, _tab_label in _tabs:}}
    <li class="nav-item">
      {{if _tab_f == active_tab:}}
      <a class="nav-link active" aria-current="page" href="{{=URL(c='audit', f=_tab_f, extension=False)}}">{{=_tab_label}}</a>
      {{else:}}
      <a class="nav-link" href="{{=URL(c='audit', f=_tab_f, extension=False)}}">{{=_tab_label}}</a>
      {{pass}}
    </li>
    {{pass}}
  </ul>
</nav>
