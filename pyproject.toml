# Configuracao das ferramentas de desenvolvimento (CR-022b9, D7). So configuracao: o projeto nao e
# instalado por pip (AGENTS §2.2), nao tem [project] nem [build-system]. O flake8 nao le este arquivo
# (fica no .flake8). mypy, isort, autopep8 e pylint rodam no Python 3.11 da maquina de desenvolvimento.

[tool.mypy]
# O mypy 1.x nao aceita alvo 3.6; a sintaxe 3.6 e conferida por tests/architecture/test_py36_compat.py.
python_version = "3.8"
mypy_path = "src"
packages = ["sss"]
strict = true
# Drivers Oracle e bibliotecas sem stubs (oracledb, cx_Oracle).
ignore_missing_imports = true

# Divida anterior ao CR-022b9: modulos com erro no modo estrito. A lista so diminui
# (tests/architecture/test_quality_debt.py): ao tipar um modulo, apague-o daqui. Nunca acrescente.
[[tool.mypy.overrides]]
module = [
    "sss.cli.check_env",
    "sss.cli.generate_sql",
    "sss.cli.health",
    "sss.cli.init_db",
    "sss.cli.probe_driver",
    "sss.cli.run_scheduler",
