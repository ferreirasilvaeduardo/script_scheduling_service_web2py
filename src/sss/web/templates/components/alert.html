{{
# Componente: mensagem de response.flash tipada.
# Variáveis de entrada:
#   alert -- resultado de ui_helpers.alert_info(flash): None (nada é exibido) ou
#            {kind: 'success' | 'warning' | 'error', message, css_class, icon, role}.
}}{{if alert:}}
<div class="alert {{=alert['css_class']}} sss-alert" role="{{=alert['role']}}">
  <svg class="sss-icon" aria-hidden="true" focusable="false"><use href="{{=URL('static', 'img/icons.svg')}}#{{=alert['icon']}}"></use></svg>
  <span>{{=alert['message']}}</span>
</div>
{{pass}}
