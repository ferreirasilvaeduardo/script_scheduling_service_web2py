; Agente do DEV (CR-028) para o ambiente CLONE7 (um agente por ambiente, 2026-10-29): instance/agente0005/;
; pastas em var/agente0005/. Suba com bin/sss-scheduler.sh agente0005 (ou pelo keepalive com os cinco nomes).
[app]
name = agente0005

[agent]
environments = CLONE7
max_parallel_jobs = 4
env_passthrough = ORACLE_HOME,TNS_ADMIN,NLS_LANG,LD_LIBRARY_PATH

[logging]
level = DEBUG
