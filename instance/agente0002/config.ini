; Agente do DEV (CR-028) para o ambiente CLONE2 (um agente por ambiente, 2026-10-29): instance/agente0002/;
; pastas em var/agente0002/. Suba com bin/sss-scheduler.sh agente0002 (ou pelo keepalive com os cinco nomes).
[app]
name = agente0002

[agent]
environments = CLONE2
max_parallel_jobs = 4
env_passthrough = ORACLE_HOME,TNS_ADMIN,NLS_LANG,LD_LIBRARY_PATH

[logging]
level = DEBUG
