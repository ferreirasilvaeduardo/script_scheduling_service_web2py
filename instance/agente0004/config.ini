; Agente do DEV (CR-028) para o ambiente CLONE6 (um agente por ambiente, 2026-10-29): instance/agente0004/;
; pastas em var/agente0004/. Suba com bin/sss-scheduler.sh agente0004 (ou pelo keepalive com os cinco nomes).
[app]
name = agente0004

[agent]
environments = CLONE6
max_parallel_jobs = 4
env_passthrough = ORACLE_HOME,TNS_ADMIN,NLS_LANG,LD_LIBRARY_PATH

[logging]
level = DEBUG
