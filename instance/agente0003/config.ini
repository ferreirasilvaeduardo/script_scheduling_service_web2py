; Agente do DEV (CR-028) para o ambiente CLONE1 (um agente por ambiente, 2026-10-29): instance/agente0003/;
; pastas em var/agente0003/. Suba com bin/sss-scheduler.sh agente0003 (ou pelo keepalive com os cinco nomes).
[app]
name = agente0003

[agent]
environments = CLONE1
max_parallel_jobs = 4
env_passthrough = ORACLE_HOME,TNS_ADMIN,NLS_LANG,LD_LIBRARY_PATH

[logging]
level = DEBUG
