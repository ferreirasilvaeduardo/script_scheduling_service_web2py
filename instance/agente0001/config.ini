; Agente do DEV (CR-028) para o ambiente GFPREPROD (um agente por ambiente, 2026-10-29): instance/agente0001/;
; pastas em var/agente0001/. Suba com bin/sss-scheduler.sh agente0001 (ou pelo keepalive com os cinco nomes).
[app]
name = agente0001

[agent]
environments = GFPREPROD
max_parallel_jobs = 4
env_passthrough = ORACLE_HOME,TNS_ADMIN,NLS_LANG,LD_LIBRARY_PATH

[logging]
level = DEBUG
